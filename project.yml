name: SuperSubmitter
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Stamps LastUpgradeCheck. XcodeGen leaves it empty, so Xcode read the
  # project as older than itself and offered "Update to recommended settings"
  # after every regeneration. Raise this when you move to a newer Xcode.
  xcodeVersion: "26.6"
# The settings Xcode recommends, set here so it stops asking. Two of its
# recommendations are refused on purpose and are named where they apply:
# CODE_SIGN_IDENTITY and ENABLE_USER_SCRIPT_SANDBOXING.
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.1.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.59.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.9.0
targets:
  SubmitKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SubmitKit
        excludes:
          - Resources
      - path: Sources/SubmitKit/Resources
        buildPhase: resources
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rafacst.supersubmitter.submitkit
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        # Xcode recommends this for every target that defines a clang module,
        # and this is the only one that does.
        ENABLE_MODULE_VERIFIER: YES
  SuperSubmitter:
    type: application
    platform: macOS
    sources:
      - path: Sources/SuperSubmitter
        excludes:
          - Resources
      - path: Sources/SuperSubmitter/Resources/AppIcon.png
        buildPhase: resources
      - path: Supporting/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: SubmitKit
      - package: PostHog
        product: PostHog
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: SuperSubmitter.entitlements
    # The build number is the commit count, the same formula the release
    # workflow uses. Without this a local build stays at CURRENT_PROJECT_VERSION
    # and Sparkle reads it as older than every published release, so "Check for
    # updates" offers the version you already have. Runs before the code
    # signature, so the stamped bundle is the signed one.
    postBuildScripts:
      - name: Stamp the build number from git
        basedOnDependencyAnalysis: false
        # The ordering edge, and the whole reason this phase works. Being last
        # in the phase list buys nothing: the build system schedules a script
        # with no declared inputs whenever it likes, and on an incremental
        # build it put this one before the Info.plist was processed. The stamp
        # landed and was then overwritten, so every incremental build carried
        # CFBundleVersion 1 while a clean build carried the commit count.
        # Naming the processed plist as an input forces it to exist first.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -euo pipefail
          cd "$SRCROOT"
          BUILD=$(git rev-list --count HEAD 2>/dev/null || echo "")
          # A missing or shallow checkout answers with nothing or with a
          # count lower than the truth. Leave the plist alone rather than
          # stamping a number that makes a new build look old.
          case "$BUILD" in
            ''|*[!0-9]*) echo "note: no git build number; keeping CURRENT_PROJECT_VERSION"; exit 0 ;;
          esac
          plutil -replace CFBundleVersion -string "$BUILD" \
            "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    # Sparkle reads SUFeedURL and SUPublicEDKey out of the bundle, the four SS
    # keys below are this app's own, and the INFOPLIST_KEY_ build settings only
    # carry the keys Apple knows. So the app writes a real Info.plist. XcodeGen
    # generates it from this block, and Xcode expands the $() at build time, so
    # a build can still override a value on the command line.
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Super Submitter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        # The OAuth callback and the billing return. ASWebAuthenticationSession
        # catches the redirect itself, but a registered scheme is what lets a
        # provider that hands off to the real browser find its way home.
        CFBundleURLTypes:
          - CFBundleURLName: com.rafacst.supersubmitter.callback
            CFBundleURLSchemes: [supersubmitter]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 Rafa CST
        NSPrincipalClass: NSApplication
        # The feed the app polls. GitHub keeps /releases/latest/download/<name>
        # pointing at the newest release, so this URL never changes.
        #
        # It is inside every bundle that ships, and a shipped bundle polls this
        # address forever. Renaming or deleting the repository strands every
        # install on the version it has, with no way to tell it where to look:
        # that is exactly what happened to the previous repository. Treat the
        # owner and the name as permanent.
        SUFeedURL: https://github.com/rafacst/app-super-submitter/releases/latest/download/appcast.xml
        # The public half of the EdDSA pair. The private half is in the login
        # keychain under the service https://sparkle-project.org, and it cannot
        # be recovered if it is lost. Never generate a second pair: the app
        # trusts this key alone, and every installed copy would refuse every
        # update signed by another one.
        SUPublicEDKey: Tz2ycxl8EBhbHB1DwRx24yiGi0wIZvbOMeyrWncwOGI=
        # The licensing service and the key that verifies its entitlement
        # documents. A build without them refuses every store write, which is
        # the safe answer.
        # No Stripe secret key or webhook secret belongs in this bundle.
        SSLicensingBaseURL: $(LICENSING_BASE_URL)
        SSEntitlementPublicKeys: $(ENTITLEMENT_PUBLIC_KEYS)
        SSSupabaseURL: $(SUPABASE_URL)
        SSSupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        SSGoogleOAuthClientID: $(GOOGLE_OAUTH_CLIENT_ID)
    settings:
      base:
        # The live licensing service. Not a secret: it is the address the app
        # calls, and every privileged Stripe call happens on the other side of
        # it. A release with this empty ships a paywall in front of nothing,
        # so the workflow fails the build rather than publish one.
        LICENSING_BASE_URL: https://super-submitter.rafacst.me
        ENTITLEMENT_PUBLIC_KEYS: "entitlement-2026-01=8dO3jS7trDDIf3o/k1raACoLvxAVSVzKSxXijjTlKNQ="
        SUPABASE_URL: https://cvrvyxcjddtpsyfxieuf.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_sI-T324LV-ymezJ0j9uecA_XZ2Dyep3
        GOOGLE_OAUTH_CLIENT_ID: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.rafacst.supersubmitter
        PRODUCT_NAME: SuperSubmitter
        MARKETING_VERSION: 1.0.4
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: 14.0
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          # Debug used to point at super-submitter-test.rafacst.me, and that
          # service answers /v1/billing/plans with `available: false` on all
          # three plans. The Account tab then disables every plan row and shuts
          # the checkout button, so a Debug build could never buy anything and
          # the whole subscription flow was untestable. Debug now uses the same
          # live service as Release, which is the flow worth testing. To point
          # a build back at a test service, export LICENSING_BASE_URL in the
          # environment: LicensingConfig reads it before the Info.plist.
          #
          # Xcode offers to "switch to development signing" here on every
          # regeneration. Refuse it. It rewrites this line to Apple
          # Development, and the whole reason for Developer ID is below.
          #
          # Signed, not ad-hoc. The file Keychain ties each item to the
          # signature of the binary that wrote it, and an ad-hoc signature is
          # the build's own hash, so every rebuild asked for the login
          # password again. A Developer ID signature is the same requirement
          # every time, so the developer allows it once.
          CODE_SIGN_IDENTITY: Developer ID Application
          DEVELOPMENT_TEAM: 88BXH8KNVZ
          CODE_SIGN_STYLE: Manual
  SubmitKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SubmitKitTests
        excludes:
          - Fixtures
      - path: Tests/SubmitKitTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SubmitKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SuperSubmitterUITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SuperSubmitterUITests
    dependencies:
      - target: SuperSubmitter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          # This bundle loads inside the app, and the app enables the hardened
          # runtime. Library validation then refuses any code that carries
          # another team's signature, and an unsigned bundle carries none. So
          # the whole suite failed to load with "different Team IDs" and every
          # test in it silently never ran. These three match the host exactly.
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 88BXH8KNVZ
schemes:
  SuperSubmitter:
    build:
      targets:
        SuperSubmitter: all
        SubmitKitTests: [test]
        SuperSubmitterUITests: [test]
    test:
      targets:
        - SubmitKitTests
        - SuperSubmitterUITests
