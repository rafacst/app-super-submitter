name: SuperSubmitter
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.1.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.59.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.9.0
targets:
  SubmitKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SubmitKit
        excludes:
          - Resources
      - path: Sources/SubmitKit/Resources
        buildPhase: resources
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rafacst.supersubmitter.submitkit
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
  SuperSubmitter:
    type: application
    platform: macOS
    sources:
      - path: Sources/SuperSubmitter
        excludes:
          - Resources
      - path: Sources/SuperSubmitter/Resources/AppIcon.png
        buildPhase: resources
      - path: Supporting/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: SubmitKit
      - package: PostHog
        product: PostHog
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: SuperSubmitter.entitlements
    # Sparkle reads SUFeedURL and SUPublicEDKey out of the bundle, and the
    # INFOPLIST_KEY_ build settings only carry the keys Apple knows. So the
    # app writes a real Info.plist. XcodeGen generates it from this block, and
    # Xcode expands the $() at build time, so CI can still override the build
    # number on the command line.
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Super Submitter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 Rafa CST
        NSPrincipalClass: NSApplication
        # The feed the app polls. GitHub keeps /releases/latest/download/<name>
        # pointing at the newest release, so this URL never changes.
        SUFeedURL: https://github.com/rafacst/super-submitter-app/releases/latest/download/appcast.xml
        # The public half of the EdDSA pair. RELEASING.md says how to make it.
        # The release workflow refuses to build while this is the placeholder.
        SUPublicEDKey: Tz2ycxl8EBhbHB1DwRx24yiGi0wIZvbOMeyrWncwOGI=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rafacst.supersubmitter
        PRODUCT_NAME: SuperSubmitter
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: 14.0
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  SubmitKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SubmitKitTests
        excludes:
          - Fixtures
      - path: Tests/SubmitKitTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SubmitKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SuperSubmitterUITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SuperSubmitterUITests
    dependencies:
      - target: SuperSubmitter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SuperSubmitter:
    build:
      targets:
        SuperSubmitter: all
        SubmitKitTests: [test]
        SuperSubmitterUITests: [test]
    test:
      targets:
        - SubmitKitTests
        - SuperSubmitterUITests
