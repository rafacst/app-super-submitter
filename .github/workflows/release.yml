name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: "One line of release notes. Blank uses the commit subjects."
        required: false
        default: ""

# One release at a time. Two pushes close together must not race for one tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The tools that sign the appcast. Keep this at or above the Sparkle
  # version that project.yml resolves.
  SPARKLE_TOOLS_VERSION: "2.9.5"
  # XcodeGen writes the project from project.yml. Pinned, and taken from the
  # release rather than from Homebrew: `brew install` spends most of a minute
  # on a tap it does not need, and this is a 4 MB zip.
  XCODEGEN_VERSION: "2.46.0"
  TEAM_ID: "88BXH8KNVZ"

jobs:
  # Beside the release, not in front of it. The job below holds nothing back:
  # it carries no `needs`, so the approval this workflow waits for is asked the
  # moment the run starts and the suite spends its minutes during that wait.
  #
  # The trade is deliberate. A red suite no longer stops the publish, because
  # nothing waits for it. It reports, and the human at the gate decides.
  test:
    runs-on: macos-26

    steps:
      # No fetch-depth here. Only the release job reads the history.
      - uses: actions/checkout@v7

      # Serial, not parallel. The suite deadlocked on a runner under parallel
      # execution: 476 tests announced themselves, none of them ever returned,
      # and the step died at its bound with nothing to name. The parallelism
      # was not even buying speed. Measured on the same 630 tests: 4.5s serial
      # against 11.6s parallel, because the contention it created cost more
      # than the concurrency returned.
      #
      # The bound is not decoration. These tests reach the Keychain, and a
      # Keychain prompt on a runner has nobody to answer it. If this fires
      # again, the last test named in the log is the one that hung.
      - name: Test
        timeout-minutes: 15
        run: swift test --no-parallel

  release:
    runs-on: macos-26
    # The gate. Add a required reviewer to this environment and every run
    # stops here until someone approves it.
    environment: release

    steps:
      - uses: actions/checkout@v7
        with:
          # The build number counts commits, and the release notes read the
          # previous tag. Both need the whole history.
          fetch-depth: 0

      - name: Name this version
        id: version
        run: |
          set -euo pipefail
          MARKETING=$(awk '/MARKETING_VERSION:/ {print $2; exit}' project.yml)
          BUILD=$(git rev-list --count HEAD)
          {
            echo "marketing=$MARKETING"
            echo "build=$BUILD"
            echo "tag=v$MARKETING-$BUILD"
            echo "name=SuperSubmitter-$MARKETING-$BUILD"
          } >> "$GITHUB_OUTPUT"

      - name: Load the signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this codesign stops to ask for the keychain password, and
          # a runner has nobody to ask.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          # The licensing address and the verifier key come from project.yml,
          # beside the Supabase pair. They are not secrets: the address is
          # what the app calls, the key is the public half, and every
          # privileged Stripe call happens on the service.
          xcodebuild build \
            -project SuperSubmitter.xcodeproj \
            -scheme SuperSubmitter \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

      # Sparkle decides that an update exists by comparing CFBundleVersion, so
      # a release that ships the wrong one is a release nobody is offered, or
      # one that offers itself forever. The number is stamped into the built
      # bundle by a script phase, and that phase silently lost a scheduling
      # race once already. Read it back off the app that is about to ship.
      - name: Check the build number reached the bundle
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/dd/Build/Products/Release/SuperSubmitter.app/Contents/Info.plist"
          STAMPED=$(plutil -extract CFBundleVersion raw -o - "$PLIST")
          EXPECTED="${{ steps.version.outputs.build }}"
          if [ "$STAMPED" != "$EXPECTED" ]; then
            echo "::error::The bundle carries build $STAMPED, but this release is $EXPECTED."
            exit 1
          fi
          echo "The bundle carries build $STAMPED."

      # A Release build with no licensing address reaches no service, so every
      # paid feature stays shut and a paying developer is locked out. Catch it
      # here, not in a user's Console log.
      - name: Check the release carries a licensing address
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/dd/Build/Products/Release/SuperSubmitter.app/Contents/Info.plist"
          for key in SSLicensingBaseURL SSEntitlementPublicKeys SSSupabaseURL SSSupabasePublishableKey; do
            value=$(plutil -extract "$key" raw -o - "$PLIST" 2>/dev/null || echo "")
            if [ -z "$value" ] || [ "$value" = "<stdin>: No value at that key path" ]; then
              echo "::error::$key is empty in the built app. Set it in project.yml or as a repository secret."
              exit 1
            fi
          done
          echo "Licensing keys are present."

      # The feed the shipped app polls, and the key it verifies the download
      # with. An empty either one ships an app that never updates, and says
      # nothing about it in the interface.
      - name: Check the release can find its own updates
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/dd/Build/Products/Release/SuperSubmitter.app/Contents/Info.plist"
          FEED=$(plutil -extract SUFeedURL raw -o - "$PLIST" 2>/dev/null || echo "")
          KEY=$(plutil -extract SUPublicEDKey raw -o - "$PLIST" 2>/dev/null || echo "")
          EXPECTED="https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml"
          if [ "$FEED" != "$EXPECTED" ]; then
            echo "::error::SUFeedURL is '$FEED'. This repository publishes to '$EXPECTED'."
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::SUPublicEDKey is empty. The app would refuse every update."
            exit 1
          fi
          echo "The app polls $FEED."

      # Xcode signs the outer Sparkle.framework and stops there. The four
      # helpers inside keep the ad-hoc signature Sparkle ships, and Apple
      # rejects ad-hoc code at notarization. So sign them from the inside out.
      - name: Sign the Sparkle helpers
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release/SuperSubmitter.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          ID="Developer ID Application"
          # Sparkle 2.9 calls it Versions/B. Read the name instead of typing it.
          V="$FW/Versions/$(readlink "$FW/Versions/Current")"
          # Autoupdate carries its own entitlement. Keep it.
          codesign --force --options runtime --timestamp \
            --preserve-metadata=entitlements --sign "$ID" \
            "$V/XPCServices/Downloader.xpc" \
            "$V/XPCServices/Installer.xpc" \
            "$V/Autoupdate" \
            "$V/Updater.app"
          codesign --force --options runtime --timestamp --sign "$ID" "$FW"
          # The app takes the entitlements file, not whatever the build left
          # behind. `xcodebuild build` injects get-task-allow, and Apple
          # refuses any binary that asks for it.
          codesign --force --options runtime --timestamp \
            --entitlements SuperSubmitter.entitlements --sign "$ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null \
            | grep -q get-task-allow; then
            echo "::error::The app still requests get-task-allow."
            exit 1
          fi
          # Nothing inside may still say "adhoc" or the notary refuses the app.
          if codesign -dvv "$V/Updater.app" 2>&1 | grep -q adhoc; then
            echo "::error::Sparkle helpers are still ad-hoc signed."
            exit 1
          fi

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release/SuperSubmitter.app"
          # Notarization takes a zip. The one users download is built again
          # after the staple, so the ticket travels inside it.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          # notarytool says little when it refuses. Capture the result, then
          # print the notary log, which names the binary Apple rejected.
          set +e
          OUT=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait --output-format json 2>&1)
          set -e
          echo "$OUT"
          ID=$(printf '%s' "$OUT" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          STATUS=$(printf '%s' "$OUT" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization did not succeed. Status: ${STATUS:-none}"
            if [ -n "$ID" ]; then
              echo "--- notary log for $ID ---"
              xcrun notarytool log "$ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$TEAM_ID" || true
            else
              echo "No submission id came back, so Apple refused before the upload."
              echo "That points at the Apple ID, the app-specific password, or the team."
            fi
            exit 1
          fi
          xcrun stapler staple "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" \
            "dist/${{ steps.version.outputs.name }}.zip"

      # HTML, not Markdown, and it must sit next to the zip under the same
      # name. Sparkle loads it into a web view, and GitHub renders a plain
      # list in a release body, so one file serves both.
      - name: Write the release notes
        env:
          # Only a hand-started run can set this. A push says what its commits
          # say, because that is the only thing it knows.
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          # These notes are read twice: once on the release page, and once
          # inside the update window of every copy already installed. Commit
          # subjects are the right default and the wrong thing for a release
          # whose real news is not a list of chores.
          escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          {
            echo "<ul>"
            if [ -n "${NOTES:-}" ]; then
              printf '%s\n' "$NOTES" | escape | sed -e 's|.*|<li>&</li>|'
            else
              PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
              git log ${PREV:+$PREV..HEAD} --no-merges --max-count=50 \
                --pretty=format:'%s' | escape | sed -e 's|.*|<li>&</li>|'
            fi
            echo "</ul>"
          } > "dist/${{ steps.version.outputs.name }}.html"
          cat "dist/${{ steps.version.outputs.name }}.html"

      - name: Sign the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_TOOLS_VERSION/Sparkle-$SPARKLE_TOOLS_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/ed_key"
          # generate_appcast reads the version out of the app inside the zip,
          # signs the zip, and folds the matching .html in as the description.
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/ed_key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/" \
            --link "https://github.com/${{ github.repository }}" \
            -o dist/appcast.xml \
            dist
          rm "$RUNNER_TEMP/ed_key"
          cat dist/appcast.xml

      # The feed the app polls is this file, so an appcast that names no build
      # or carries no signature strands every install. Read it back before it
      # is published rather than after.
      - name: Check the appcast offers this build, signed
        run: |
          set -euo pipefail
          if ! grep -q 'sparkle:edSignature=' dist/appcast.xml; then
            echo "::error::The appcast carries no EdDSA signature. Every app would refuse it."
            exit 1
          fi
          # An element, not an attribute. generate_appcast writes
          # <sparkle:version>130</sparkle:version>, while edSignature above is
          # an attribute on <enclosure>. The two are not the same shape.
          if ! grep -q "<sparkle:version>${{ steps.version.outputs.build }}</sparkle:version>" dist/appcast.xml; then
            echo "::error::The appcast does not offer build ${{ steps.version.outputs.build }}."
            exit 1
          fi
          echo "The appcast offers build ${{ steps.version.outputs.build }}, signed."

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The download the website links to. Its name never changes, so
          # releases/latest/download/SuperSubmitter.zip redirects to whatever
          # the newest release holds and the link on the site never goes stale.
          # It is a copy, not a rename: the appcast names the versioned zip
          # above, and the update path is not worth touching for a URL. It is
          # also made here rather than in dist/, because generate_appcast reads
          # every zip in that folder and a second one would be a second item in
          # the feed.
          cp "dist/${{ steps.version.outputs.name }}.zip" \
             "$RUNNER_TEMP/SuperSubmitter.zip"
          # generate_appcast folds HTML notes into the appcast itself, so the
          # update window needs no download. The notes ship as an asset anyway:
          # a Markdown notes file makes it emit a link to
          # releases/latest/download/ instead, and then the asset must be there.
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/${{ steps.version.outputs.name }}.zip" \
            "$RUNNER_TEMP/SuperSubmitter.zip" \
            "dist/${{ steps.version.outputs.name }}.html" \
            dist/appcast.xml \
            --title "${{ steps.version.outputs.marketing }} (${{ steps.version.outputs.build }})" \
            --notes-file "dist/${{ steps.version.outputs.name }}.html"
