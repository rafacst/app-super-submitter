name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. Two pushes close together must not race for one tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The tools that sign the appcast. Keep this at or above the Sparkle
  # version that project.yml resolves.
  SPARKLE_TOOLS_VERSION: "2.9.5"
  TEAM_ID: "88BXH8KNVZ"

jobs:
  release:
    runs-on: macos-26
    # The gate. Add a required reviewer to this environment and every run
    # stops here until someone approves it. See RELEASING.md.
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          # The build number counts commits, and the release notes read the
          # previous tag. Both need the whole history.
          fetch-depth: 0

      - name: Name this version
        id: version
        run: |
          set -euo pipefail
          MARKETING=$(awk '/MARKETING_VERSION:/ {print $2; exit}' project.yml)
          BUILD=$(git rev-list --count HEAD)
          {
            echo "marketing=$MARKETING"
            echo "build=$BUILD"
            echo "tag=v$MARKETING-$BUILD"
            echo "name=SuperSubmitter-$MARKETING-$BUILD"
          } >> "$GITHUB_OUTPUT"

      - name: Check the Sparkle public key is set
        run: |
          if grep -q REPLACE_WITH_SPARKLE_PUBLIC_KEY project.yml; then
            echo "::error file=project.yml::SUPublicEDKey is still the placeholder. See RELEASING.md."
            exit 1
          fi

      - name: Load the signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this codesign stops to ask for the keychain password, and
          # a runner has nobody to ask.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign
        run: |
          set -euo pipefail
          brew install --quiet xcodegen
          xcodegen generate
          xcodebuild build \
            -project SuperSubmitter.xcodeproj \
            -scheme SuperSubmitter \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      # Xcode signs the outer Sparkle.framework and stops there. The four
      # helpers inside keep the ad-hoc signature Sparkle ships, and Apple
      # rejects ad-hoc code at notarization. So sign them from the inside out.
      - name: Sign the Sparkle helpers
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release/SuperSubmitter.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          ID="Developer ID Application"
          # Sparkle 2.9 calls it Versions/B. Read the name instead of typing it.
          V="$FW/Versions/$(readlink "$FW/Versions/Current")"
          # Autoupdate carries its own entitlement. Keep it.
          codesign --force --options runtime --timestamp \
            --preserve-metadata=entitlements --sign "$ID" \
            "$V/XPCServices/Downloader.xpc" \
            "$V/XPCServices/Installer.xpc" \
            "$V/Autoupdate" \
            "$V/Updater.app"
          codesign --force --options runtime --timestamp --sign "$ID" "$FW"
          codesign --force --options runtime --timestamp \
            --preserve-metadata=entitlements --sign "$ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Nothing inside may still say "adhoc" or the notary refuses the app.
          if codesign -dvv "$V/Updater.app" 2>&1 | grep -q adhoc; then
            echo "::error::Sparkle helpers are still ad-hoc signed."
            exit 1
          fi

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release/SuperSubmitter.app"
          # Notarization takes a zip. The one users download is built again
          # after the staple, so the ticket travels inside it.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" \
            "dist/${{ steps.version.outputs.name }}.zip"

      # HTML, not Markdown, and it must sit next to the zip under the same
      # name. Sparkle loads it into a web view, and GitHub renders a plain
      # list in a release body, so one file serves both.
      - name: Write the release notes
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          {
            echo "<ul>"
            git log ${PREV:+$PREV..HEAD} --no-merges --max-count=50 \
              --pretty=format:'%s' \
              | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
                    -e 's|.*|<li>&</li>|'
            echo "</ul>"
          } > "dist/${{ steps.version.outputs.name }}.html"
          cat "dist/${{ steps.version.outputs.name }}.html"

      - name: Sign the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_TOOLS_VERSION/Sparkle-$SPARKLE_TOOLS_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/ed_key"
          # generate_appcast reads the version out of the app inside the zip,
          # signs the zip, and folds the matching .md in as the description.
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/ed_key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/" \
            --link "https://github.com/${{ github.repository }}" \
            -o dist/appcast.xml \
            dist
          rm "$RUNNER_TEMP/ed_key"
          cat dist/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # generate_appcast folds HTML notes into the appcast itself, so the
          # update window needs no download. The notes ship as an asset anyway:
          # a Markdown notes file makes it emit a link to
          # releases/latest/download/ instead, and then the asset must be there.
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/${{ steps.version.outputs.name }}.zip" \
            "dist/${{ steps.version.outputs.name }}.html" \
            dist/appcast.xml \
            --title "${{ steps.version.outputs.marketing }} (${{ steps.version.outputs.build }})" \
            --notes-file "dist/${{ steps.version.outputs.name }}.html"
